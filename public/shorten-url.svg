<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="A long link shrinks into a short link">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="type"><rect x="92" y="130" height="40" width="0">
      <animate attributeName="width" dur="7s" repeatCount="indefinite" keyTimes="0;0.06;0.34;1" values="0;0;570;570"/>
    </rect></clipPath>
  </defs>

  <rect width="720" height="300" fill="#0a0a0f"/>
  <ellipse cx="360" cy="150" rx="320" ry="110" fill="url(#glow)"/>

  <g opacity="0">
    <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.03;0.97;0.995;1" values="0;1;1;0;0"/>

    <!-- pill that physically shrinks -->
    <rect x="40" y="118" width="640" height="64" rx="32" fill="#12121a" stroke="url(#edge)" stroke-width="1.5">
      <animate attributeName="x" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.44;0.60;1" keySplines="0 0 1 1;0.65 0 0.35 1;0 0 1 1" values="40;40;230;230"/>
      <animate attributeName="width" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.44;0.60;1" keySplines="0 0 1 1;0.65 0 0.35 1;0 0 1 1" values="640;640;260;260"/>
    </rect>

    <!-- link icon rides the left edge -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="7s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.44;0.60;1" keySplines="0 0 1 1;0.65 0 0.35 1;0 0 1 1" values="0 0;0 0;192 0;192 0"/>
      <g transform="translate(60 140.5) scale(0.8)" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 7h3a5 5 0 0 1 0 10h-3m-6 0H6A5 5 0 0 1 6 7h3M8 12h8"/>
      </g>
    </g>

    <!-- long URL: typed, then fades before the pill closes in -->
    <g>
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.42;0.48;1" values="1;1;0;0"/>
      <g clip-path="url(#type)">
        <text x="92" y="155" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="14"><tspan fill="#e5e7eb">example.com</tspan><tspan fill="#9ca3af">/blog/how-to-grow-your-audience</tspan><tspan fill="#5b6070">?utm_source=email&amp;ref=12345</tspan></text>
      </g>
      <g>
        <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.34;0.35;1" values="1;1;0;0"/>
        <g>
          <animateTransform attributeName="transform" type="translate" dur="7s" repeatCount="indefinite" keyTimes="0;0.06;0.34;1" values="0 0;0 0;563 0;563 0"/>
          <rect x="92" y="138" width="2" height="24" rx="1" fill="#e5e7eb">
            <animate attributeName="opacity" dur="1s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5" values="1;0"/>
          </rect>
        </g>
      </g>
    </g>

    <!-- short URL -->
    <g opacity="0">
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.58;0.66;1" values="0;0;1;1"/>
      <animateTransform attributeName="transform" type="translate" dur="7s" repeatCount="indefinite" keyTimes="0;0.58;0.66;1" values="0 8;0 8;0 0;0 0"/>
      <text x="276" y="155" font-family="ui-monospace,SFMono-Regular,Consolas,Menlo,monospace" font-size="14" font-weight="700"><tspan fill="#9ca3af">short.ly</tspan><tspan fill="#f9fafb">/x7Kp2</tspan></text>
    </g>

    <!-- success badge -->
    <circle cx="455" cy="150" r="13" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0">
      <animate attributeName="r" dur="7s" repeatCount="indefinite" keyTimes="0;0.76;0.86;1" values="13;13;30;30"/>
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.76;0.765;0.86;1" values="0;0;0.6;0;0"/>
    </circle>
    <g transform="translate(455 150)" opacity="0">
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.72;0.75;1" values="0;0;1;1"/>
      <g>
        <animateTransform attributeName="transform" type="scale" dur="7s" repeatCount="indefinite" keyTimes="0;0.72;0.77;0.80;1" values="0;0;1.2;1;1"/>
        <circle r="13" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-width="1.5"/>
        <path d="M-5 0.5 l3.5 3.5 l6.5 -7.5" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- character counter -->
    <text x="360" y="216" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" letter-spacing="1.5" fill="#6b7280" opacity="0">
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.30;0.36;0.44;0.50;1" values="0;0;1;1;0;0"/>
      67 CHARACTERS
    </text>
    <text x="360" y="216" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" letter-spacing="1.5" fill="#34d399" opacity="0">
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite" keyTimes="0;0.74;0.81;1" values="0;0;1;1"/>
      14 CHARACTERS · 79% SHORTER
    </text>
  </g>
</svg>
